<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MOODAY LAB</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

<div id="app">

  <!-- 顶部 -->
  <header class="top-bar">
    <h1 class="logo">MOODAY LAB</h1>
  </header>

  <!-- 首页 -->
  <main class="page-container">

    <!-- Banner -->
    <section class="banner-section">
      <div class="banner-slider">

        <div class="banner-item active">
          <img src="assets/images/banner1.png" alt="">
        </div>

        <div class="banner-item">
          <img src="assets/images/banner2.png" alt="">
        </div>

        <div class="banner-item">
          <img src="assets/images/banner3.png" alt="">
        </div>

        <div class="banner-item">
          <img src="assets/images/banner4.png" alt="">
        </div>

      </div>
    </section>

    <!-- Coupang -->
    <a class="store-card" href="https://www.coupang.com/np/search?q=MOODAY%20LAB" target="_blank" rel="noopener noreferrer" aria-label="Coupang MOODAY LAB 주문 방법">

      <div class="store-24h">

        <svg class="store-cart-icon" viewBox="0 0 64 64">
          <path d="M7 10h8l6 31h29l7-24H18"/>
          <circle cx="25" cy="51" r="3"/>
          <circle cx="48" cy="51" r="3"/>
        </svg>

        <span class="store-24h-text">24H</span>

      </div>

      <img
        class="coupang-logo"
        src="assets/images/coupang-logo.png"
        alt="Coupang"
      >

      <span class="store-name">MOODAY LAB</span>

    </a>

    <!-- 六个按钮 -->
    <section class="product-grid">

      <!-- 1 -->
      <button class="product-card">

        <div class="product-icon">
          <img src="assets/images/products/photoFrame.png" alt="">
        </div>

        <div class="product-info">
          <p class="title">인화지 액자</p>
        </div>

      </button>

      <!-- 2 -->
      <button class="product-card">

        <div class="product-icon">
          <img src="assets/images/products/artFrame.png" alt="">
        </div>

        <div class="product-info">
          <p class="title">아트지 액자</p>
        </div>

      </button>

      <!-- 3 -->
      <button class="product-card">

        <div class="product-icon">
          <img src="assets/images/products/magicMirror.png" alt="">
        </div>

        <div class="product-info">
          <p class="title">매직미러</p>
        </div>

      </button>

      <!-- 4 -->
      <button class="product-card">

        <div class="product-icon">
          <img src="assets/images/products/idPhoto.png" alt="">
        </div>

        <div class="product-info">
          <p class="title">증명사진</p>
        </div>

      </button>

      <!-- 5 -->
      <button class="product-card">

        <div class="product-icon">
          <img src="assets/images/products/freeProfile.png" alt="">
        </div>

        <div class="product-info">
          <p class="title">무료 프로필</p>
        </div>

      </button>

      <!-- 6 -->
      <button class="product-card">

        <div class="product-icon">
          <img src="assets/images/products/freeWallpaper.png" alt="">
        </div>

        <div class="product-info">
          <p class="title">무료 배경</p>
        </div>

      </button>

    </section>

  </main>

</div>

<script src="config/layoutConfig.js"></script>
<script src="pages/home/homePage.js"></script>
<script src="pages/home/bannerSlider.js"></script>

</body>
</html>
